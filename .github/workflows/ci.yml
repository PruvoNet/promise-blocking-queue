name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: false

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: 24.x
  PRIMARY_OS: ubuntu-latest

jobs:
  test:
    name: CI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        node-version: [ 14.x, 16.x, 18.x, 20.x, 22.x, 24.x ]

    env:
      # Node 22+ loads .ts files natively, which bypasses ts-node in the mocha setup. Older Node rejects the flag.
      TEST_NODE_OPTIONS: ${{ (matrix.node-version == '22.x' || matrix.node-version == '24.x') && '--no-experimental-strip-types' || '' }}

    steps:

      - uses: actions/checkout@v5
        name: Checkout
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: |
          echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ matrix.os }}-${{ matrix.node-version }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.node-version }}-yarn-

      - name: Install dependencies and build
        run: |
          yarn install --ignore-engines --frozen-lockfile
          yarn build

      - name: Snyk security check
        if: matrix.node-version == env.PRIMARY_NODE_VERSION && matrix.os == env.PRIMARY_OS && !github.event.pull_request.head.repo.fork
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run unit tests with coverage
        if: matrix.node-version == env.PRIMARY_NODE_VERSION && matrix.os == env.PRIMARY_OS
        env:
          NODE_OPTIONS: ${{ env.TEST_NODE_OPTIONS }}
        run: yarn cover

      - name: Run unit tests
        if: "!(matrix.node-version == env.PRIMARY_NODE_VERSION && matrix.os == env.PRIMARY_OS)"
        env:
          NODE_OPTIONS: ${{ env.TEST_NODE_OPTIONS }}
        run: yarn mocha
