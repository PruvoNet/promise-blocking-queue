name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
  workflow_call:

permissions: {}

jobs:
  ci:
    uses: PruvoNet/oss-workflows/.github/workflows/ci-node.yml@638c70a621e280086c02bc7dcf4ccca4580d9041 # v1
    permissions:
      contents: read
    with:
      package-manager: yarn
      node-versions: '["14.x", "16.x", "18.x", "20.x", "22.x", "24.x"]'
      install-command: yarn install --ignore-engines --frozen-lockfile
      build-command: yarn build
      test-command: yarn mocha
      coverage-command: yarn cover
      test-node-options: '{"22.x": "--no-experimental-strip-types", "24.x": "--no-experimental-strip-types"}'

  zizmor:
    uses: PruvoNet/oss-workflows/.github/workflows/zizmor.yml@638c70a621e280086c02bc7dcf4ccca4580d9041 # v1
    permissions:
      contents: read
